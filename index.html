<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自然堂单品&套组素材框架调整建议</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --ink:#16213e; --ink2:#4a5578; --ink3:#8590ab; --line:#e4e8f1; --bg:#f6f8fc; --card:#fff;
  --A:#ef6c3e; --A-soft:#fff1ea; --A-deep:#c24d22; --A-light:#f6a07f; --A-line:#f7cdbb;
  --B:#0e9f8e; --B-soft:#e6f7f4; --B-deep:#0a7a6d; --B-light:#4cc7b8; --B-line:#b7e6df;
  --navy:#0f1b3d; --gold:#f5b324;
  --brand-soft:#eef3ff; --brand-soft2:#f7f9ff; --brand-line:#c9d8ff; --brand-ink:#2a4bb0;
  --cover-bg:radial-gradient(1200px 600px at 80% 20%,#26407e 0%,transparent 60%),linear-gradient(135deg,#0b1430,#15264f 60%,#1b2f63);
  --cover-ink:#0b1430; --cover-sub:#b9c4e6; --cover-dim:#8fa2d8; --cover-hint:#8e9bc6; --cover-text:#e6ecff; --cover-cap:#cdd6f3;
  --grad-hi:linear-gradient(90deg,#ff9a70,#ffd166); --grad-pill:linear-gradient(90deg,#ffd166,#ff9a70);
  --r:18px; --shadow:0 6px 24px rgba(22,33,62,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.progress{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--A),var(--gold),var(--B));width:0;z-index:50}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:10px}
.dots a{width:9px;height:9px;border-radius:50%;background:#c3cadc;position:relative;display:block;transition:.2s}
.dots a.on{background:var(--ink);transform:scale(1.35)}
.dots a:hover::after{content:attr(data-t);position:absolute;right:18px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-size:12px;padding:3px 9px;border-radius:6px}
.counter{position:fixed;right:22px;bottom:16px;font-size:12px;color:var(--ink3);z-index:40;font-variant-numeric:tabular-nums}

section.slide{min-height:100vh;padding:56px 7vw 60px;display:flex;flex-direction:column;justify-content:center;position:relative}
section.slide:nth-child(even){background:#fff}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--B-deep);margin-bottom:10px}
.kicker b{background:var(--ink);color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;letter-spacing:0}
h2.title{font-size:clamp(26px,3.1vw,42px);line-height:1.25;font-weight:800;letter-spacing:-.01em;max-width:1100px}
h2.title em{font-style:normal;color:var(--A)}
h2.title strong{color:var(--B)}
.sub{color:var(--ink2);font-size:clamp(14px,1.25vw,17px);margin-top:10px;max-width:880px}
.body{margin-top:30px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.08s}.d2{transition-delay:.16s}.d3{transition-delay:.24s}.d4{transition-delay:.32s}.d5{transition-delay:.4s}


.rule{background:linear-gradient(135deg,var(--brand-soft),var(--brand-soft2));border:1px solid var(--brand-line);border-radius:var(--r);padding:16px 24px;text-align:center}
.rule .rl{font-size:14px;font-weight:700;color:var(--brand-ink);margin-bottom:6px}
.rule .rf{font-size:clamp(17px,1.9vw,26px);font-weight:800}
.rule .rf em{font-style:normal;color:var(--A);background:var(--A-soft);padding:0 8px;border-radius:8px}
.rule .rs{font-size:13px;color:var(--ink2);margin-top:6px}
.kp2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.kcard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--B);border-radius:14px;padding:14px 20px;box-shadow:var(--shadow)}
.kcard:nth-child(2){border-left-color:var(--gold)}
.kcard span{font-size:12px;color:var(--ink3);font-weight:700}
.kcard b{display:block;font-size:22px;margin:2px 0}.kcard b i{font-style:normal;color:var(--B)}
.kcard em{font-style:normal;font-size:13px;color:var(--ink2)}
.h3{font-size:17px;margin:20px 0 12px}
#why .metric{padding:20px 26px}
@media(max-width:900px){.kp2{grid-template-columns:1fr}}
/* tags */
.tagA,.tagB{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}
.tagA{background:var(--A-soft);color:var(--A-deep)}
.tagB{background:var(--B-soft);color:var(--B-deep)}
.txtA{color:var(--A)}.txtB{color:var(--B)}

/* video thumbnails */
.ref{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:5px;vertical-align:top;width:92px;text-align:center;transition:transform .18s}
.ref:hover{transform:translateY(-4px)}
.ref .ph{position:relative;width:100%;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#cfd6e8,#9aa6c4);box-shadow:0 4px 14px rgba(22,33,62,.2);border:2px solid #fff}
.ref .ph img{width:100%;height:100%;object-fit:cover;display:block}
.ref .ph .nop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;opacity:.85}
.ref .num{position:absolute;left:5px;top:5px;background:rgba(15,27,61,.85);color:#fff;font-size:11px;font-weight:700;padding:0 6px;border-radius:6px;line-height:18px}
.ref.A .num{background:var(--A)} .ref.B .num{background:var(--B)}
.ref .play{position:absolute;right:5px;bottom:5px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.ref .play::after{content:"";border-left:9px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.ref .cap{font-size:11px;color:var(--ink2);line-height:1.25;min-height:14px}
.ref.lg{width:132px}.ref.sm{width:74px}
.ref.xl{width:150px}
.refs{display:flex;gap:12px;flex-wrap:wrap}

/* cover */
.cover{background:var(--cover-bg);color:#fff;overflow:hidden}
.cover .kicker{color:var(--gold)}
.cover h1{font-size:clamp(34px,4.6vw,68px);line-height:1.15;font-weight:800;max-width:780px;letter-spacing:-.02em}
.cover h1 em{font-style:normal;background:var(--grad-hi);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover h1 .h1s{display:block;font-size:.44em;line-height:1.4;margin-top:14px;white-space:nowrap;font-weight:700;letter-spacing:0}.cover .lead{margin-top:20px;color:var(--cover-sub);font-size:clamp(15px,1.4vw,19px);max-width:620px}
.cover .stats{display:flex;gap:34px;margin-top:40px;flex-wrap:wrap}
.cover .stats div{border-left:3px solid var(--gold);padding-left:14px}
.cover>*:not(.collage):not(.hint){max-width:min(820px,48vw)}.cover .stats{gap:26px 30px}.cover .stats b{display:block;font-size:clamp(22px,2.3vw,34px);line-height:1.15}
.cover .stats span{font-size:13px;color:var(--cover-sub)}
.collage{position:absolute;right:7vw;top:50%;transform:translateY(-50%);display:flex;gap:18px}
.collage .ref{width:clamp(110px,11vw,170px)}
.collage .ref:nth-child(1){transform:translateY(40px) rotate(-5deg)}
.collage .ref:nth-child(2){transform:translateY(-20px) rotate(2deg)}
.collage .ref:nth-child(3){transform:translateY(50px) rotate(-2deg)}
.collage .ref:hover{transform:translateY(-10px) scale(1.05)}
.collage .ref .cap{color:var(--cover-cap)}
.hint{position:absolute;bottom:26px;left:7vw;font-size:13px;color:var(--cover-hint)}
@media(max-width:1100px){.collage{display:none}}


.cover h1{font-size:clamp(34px,4.4vw,64px)}
.cover h1 .h1a{display:inline-block;font-size:.42em;font-weight:800;letter-spacing:.12em;color:var(--cover-ink);background:var(--grad-pill);padding:5px 18px;border-radius:99px;margin-bottom:18px}
.cover h1 .h1a+*{}
.cover h1{display:flex;flex-direction:column;align-items:flex-start}
.cover .hook{margin-top:22px;font-size:clamp(16px,1.6vw,22px);line-height:1.7;color:var(--cover-text);font-weight:600}
.cover .hook b{color:var(--gold);font-size:1.15em}
.cover .stats .big b{font-size:clamp(26px,2.9vw,44px);background:var(--grad-hi);-webkit-background-clip:text;background-clip:text;color:transparent}
.cover .stats b i{font-style:normal;color:var(--cover-dim);-webkit-text-fill-color:var(--cover-dim)}
.cover .stats .big{border-left-width:5px}
/* big compare */
.bigcmp{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.metric{background:var(--card);border-radius:var(--r);padding:28px 30px;box-shadow:var(--shadow);border:1px solid var(--line)}
.metric h4{font-size:15px;color:var(--ink2);font-weight:600;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:14px;margin:10px 0}
.mrow .lb{width:46px;font-weight:800;font-size:14px}
.mrow .track{flex:1;height:34px;background:#eef1f8;border-radius:10px;overflow:hidden;position:relative}
.mrow .fill{height:100%;width:0;border-radius:10px;transition:width 1.2s cubic-bezier(.2,.8,.2,1);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;color:#fff;font-weight:800;font-size:15px;white-space:nowrap}
.in .mrow .fill{width:var(--w)}
.fillA{background:linear-gradient(90deg,var(--A-light),var(--A))}
.fillB{background:linear-gradient(90deg,var(--B-light),var(--B))}
.mrow .track .out{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:15px;white-space:nowrap}
.mrow .out{color:var(--ink)}
.mult{margin-top:14px;font-size:14px;color:var(--ink2)}
.mult b{font-size:34px;color:var(--B);font-weight:800;margin-right:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.tcard{background:var(--card);border-radius:var(--r);padding:20px 22px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.tcard .n{font-size:13px;font-weight:800;color:var(--B-deep);letter-spacing:.06em}
.tcard h5{font-size:18px;margin:4px 0 8px;line-height:1.35}
.tcard p{font-size:14px;color:var(--ink2)}
.tcard p b{color:var(--ink)}
@media(max-width:900px){.bigcmp,.trio,.c4{grid-template-columns:1fr}}

/* hook type cards */
.cols{display:grid;gap:20px}
.c3{grid-template-columns:repeat(3,1fr)}
.c4{grid-template-columns:repeat(4,1fr);gap:16px}
.c4 .tpl{padding:16px 14px;gap:10px}.c4 .flow span{font-size:12px;padding:6px 10px 6px 16px}.c4 .tpl .apply{font-size:12.5px}.c4 .tpl .sub2{font-size:12.5px}.c4 .tpl .top{flex-direction:column;gap:10px}.c4 .tpl h5{font-size:17px}.c4 .kpi b{font-size:26px}
.c5{grid-template-columns:repeat(5,1fr);gap:16px}
.c2{grid-template-columns:repeat(2,1fr)}
.hcard{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hcard::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--A)}
.hcard.B::before{background:var(--B)}
.hcard h5{font-size:17px;line-height:1.3}
.hcard .quote{font-size:14px;color:var(--ink2);background:#f5f7fb;border-radius:10px;padding:8px 12px;border-left:3px solid #ccd3e6}
.hcard .quote b{color:var(--ink)}
.hcard.A .quote{border-left-color:var(--A)}
.hcard.B .quote{border-left-color:var(--B)}
.alert{margin-top:22px;display:flex;align-items:center;gap:14px;background:var(--A-soft);border:1px solid var(--A-line);color:var(--A-deep);border-radius:14px;padding:14px 20px;font-weight:700;font-size:clamp(14px,1.3vw,18px);flex-wrap:wrap}
.alert .chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.alert .chain i{font-style:normal;opacity:.6}
.good{margin-top:22px;display:flex;align-items:center;gap:14px;background:var(--B-soft);border:1px solid var(--B-line);color:var(--B-deep);border-radius:14px;padding:14px 20px;font-weight:700;font-size:clamp(14px,1.3vw,18px);flex-wrap:wrap}

/* B hook cards: rate */
.rate{display:flex;align-items:flex-end;gap:10px}
.rate .big{font-size:42px;font-weight:800;line-height:1;color:var(--B)}
.rate .big small{font-size:20px}
.rate .lab{font-size:12px;color:var(--ink3);padding-bottom:5px;line-height:1.3}
.meter{position:relative;height:10px;background:#eaeef6;border-radius:99px;overflow:visible;margin-top:4px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--B-light),var(--B));border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.in .meter i{width:var(--w)}
.meter u{position:absolute;top:-4px;bottom:-4px;left:30%;width:2px;background:var(--A);text-decoration:none}
.meter-note{font-size:11px;color:var(--ink3);display:flex;justify-content:space-between;margin-top:6px}
.meter-note span:last-child{color:var(--A)}
.hcard:has(.badge-top) h5{padding-right:64px}
.badge-top{position:absolute;right:14px;top:16px;background:var(--gold);color:#5a3d00;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px}

/* versus rows */
.vs{display:flex;flex-direction:column;gap:12px}
.vrow{display:grid;grid-template-columns:1fr 150px 1fr;align-items:stretch;gap:0;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
.vrow .a,.vrow .b{padding:16px 22px;font-size:clamp(14px,1.3vw,18px);font-weight:700;display:flex;flex-direction:column;justify-content:center}
.vrow .a{background:var(--A-soft);color:var(--A-deep);align-items:flex-end;text-align:right}
.vrow .b{background:var(--B-soft);color:var(--B-deep)}
.vrow .m{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink2);background:#fff;text-align:center;padding:0 8px}
.vrow .a small,.vrow .b small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.vs-head{display:grid;grid-template-columns:1fr 150px 1fr;font-weight:800;font-size:15px;margin-bottom:4px}
.vs-head div:first-child{text-align:right;color:var(--A);padding-right:22px}
.vs-head div:last-child{color:var(--B);padding-left:22px}
.vs-head span{display:inline-block;padding:3px 14px;border-radius:99px}
.vs-head div:first-child span{background:var(--A-soft)}
.vs-head div:last-child span{background:var(--B-soft)}
@media(max-width:800px){.vrow,.vs-head{grid-template-columns:1fr 1fr}.vrow .m{grid-column:1/-1;order:-1;padding:6px;background:#f4f6fb}.vs-head div:nth-child(2){display:none}}

/* two-col layouts */
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);padding:24px 26px;border:1px solid var(--line);box-shadow:var(--shadow)}
.card h4{font-size:16px;margin-bottom:14px}
/* age chart */
.age{position:relative;margin-top:12px;padding-top:30px}
.age .axis{position:relative;height:150px}
.age .core{position:absolute;top:0;bottom:22px;background:repeating-linear-gradient(45deg,rgba(245,179,36,.18) 0 8px,rgba(245,179,36,.08) 8px 16px);border:1px dashed var(--gold);border-radius:8px}
.age .core span{position:absolute;top:-24px;left:0;white-space:nowrap;font-size:12px;font-weight:700;color:#9a6b00}
.age .bar{position:absolute;height:44px;border-radius:12px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.in .age .bar{transform:scaleX(1)}
.age .ticks{position:absolute;left:0;right:0;bottom:0;height:20px;border-top:1px solid var(--line)}
.age .ticks span{position:absolute;top:3px;font-size:12px;color:var(--ink3);transform:translateX(-50%)}

/* star timeline */
.tl{margin-top:6px}
.tl-row{display:flex;align-items:center;gap:14px;margin:12px 0}
.tl-row .who{width:150px;font-size:13px;font-weight:700;line-height:1.3}
.tl-row .track{position:relative;flex:1;height:30px;background:#eef1f8;border-radius:99px}
.tl-row .pin{position:absolute;top:50%;transform:translate(-9px,-50%);display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--ink)}.tl-row .pin::before{content:'';width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--c)}.tl-axis{position:relative;height:18px;margin-left:164px}.tl-axis span{position:absolute;transform:translateX(-50%)}
.tl-axis{font-size:11px;color:var(--ink3)}

/* before-after paths */
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.path{display:grid;grid-template-columns:auto 30px auto;justify-content:center;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.path .arrow{font-size:26px;color:var(--ink3);text-align:center}
.path .txt h5{font-size:17px;margin-bottom:6px}
.path .txt p{font-size:14px;color:var(--ink2)}
.path .txt p b{color:var(--ink)}
.path .lbl{font-size:11px;text-align:center;margin-bottom:4px;font-weight:700}
.path .txt{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:12px}@media(max-width:1000px){.paths{grid-template-columns:1fr}}

/* template flow */
.tpl{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px}
.tpl .top{display:flex;gap:16px;align-items:flex-start}
.tpl h5{font-size:19px}
.tpl .sub2{font-size:13px;color:var(--ink2);margin-top:2px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow span{background:var(--B-soft);color:var(--B-deep);font-weight:700;font-size:13px;padding:7px 14px 7px 20px;position:relative;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);margin-right:-4px;line-height:1.3}
.flow span:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);padding-left:14px;border-radius:8px 0 0 8px}
.kpis{display:flex;gap:12px}
.kpi{flex:1;background:#f5f7fb;border-radius:12px;padding:10px 14px}
.kpi b{display:block;font-size:30px;line-height:1.1;color:var(--B)}
.kpi span{font-size:12px;color:var(--ink3)}
.apply{border-top:1px dashed var(--line);padding-top:12px;font-size:13px;color:var(--ink2)}
.apply .refs{margin-top:8px}

/* checklist table */
.chk{display:flex;flex-direction:column;gap:10px}
.chk .hd,.chk .row{display:grid;grid-template-columns:130px 1fr 1fr 1.25fr;gap:10px;align-items:stretch}
.chk .hd div{font-size:13px;font-weight:800;padding:4px 14px}
.chk .hd div:nth-child(2){color:var(--A)}.chk .hd div:nth-child(3){color:var(--B)}.chk .hd div:nth-child(4){color:var(--ink)}
.chk .row>div{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;align-items:center}
.chk .row .k{background:var(--navy);color:#fff;font-weight:800;gap:8px}
.chk .row .ca{background:var(--A-soft);color:var(--A-deep)}
.chk .row .cb{background:var(--B-soft);color:var(--B-deep)}
.chk .row .cc{background:#fff;border:2px solid var(--gold);font-weight:800;color:var(--ink);box-shadow:var(--shadow)}
@media(max-width:1000px){.chk .hd{display:none}.chk .row{grid-template-columns:1fr 1fr}.chk .row .k{grid-column:1/-1}}

/* formulas */
.formula{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.fm{background:linear-gradient(160deg,#fff,#f1f5fb);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;text-align:center;box-shadow:var(--shadow)}
.fm .ico{font-size:30px}
.fm h5{font-size:17px;margin:6px 0 4px}
.fm p{font-size:12.5px;color:var(--ink2)}
.fm .vsline{margin-top:8px;font-size:12px}
.fm .vsline s{color:var(--A);opacity:.8}
.fm .vsline b{color:var(--B)}
@media(max-width:1000px){.formula{grid-template-columns:repeat(2,1fr)}}

}
function versus(heads,rows){
  return `<div class="vs"><div class="vs-head rv"><div><span>${heads[0]}</span></div><div></div><div><span>${heads[1]}</span></div></div>`+
   rows.map((r,i)=>`<div class="vrow rv d${i}"><div class="a">${r.a}${r.a_sub?`<small>${r.a_sub}</small>`:''}</div><div class="m">${r.m}</div><div class="b">${r.b}${r.b_sub?`<small>${r.b_sub}</small>`:''}</div></div>`).join('')+`</div>`;
}

/* ================= 页面组件库（content.json 的 type 字段） ================= */
const R={};

/* 封面 */
R.cover=s=>`
  <div class="kicker">${s.tag?`<b>${s.tag}</b> `:''}${s.kicker||''}</div>
  <h1>${s.pill?`<span class="h1a">${s.pill}</span>`:''}${s.title_main||''}${s.title_em?`<em>${s.title_em}</em>`:''}</h1>
  ${s.hook?`<p class="hook">${s.hook}</p>`:''}
  <div class="stats">${(s.stats||[]).map(t=>`<div class="${t.big?'big':''}"><b>${t.v}</b><span>${t.d}</span></div>`).join('')}</div>
  <div class="collage">${(s.collage||[]).map(x=>ref(x)).join('')}</div>
  <div class="hint">${s.hint||'↓ 向下滚动 / 键盘 ← → 翻页 · 点击任意缩略图直接播放视频'}</div>`;

/* 背景/为什么：公式 + 指标卡 + 对比条 + 结论 */
R.why=s=>head(s)+`<div class="body">
  ${s.rule?`<div class="rule rv"><div class="rl">${s.rule.label}</div><div class="rf">${s.rule.formula}</div>${s.rule.note?`<div class="rs">${s.rule.note}</div>`:''}</div>`:''}
  ${s.kpis?`<div class="kp2">${s.kpis.map((k,i)=>`<div class="kcard rv d${i+1}"><span>${k.tag}</span><b>${k.name} <i>↑</i></b><em>${k.desc}</em></div>`).join('')}</div>`:''}
  ${s.compare_title?`<h3 class="h3 rv">${s.compare_title}</h3>`:''}
  ${s.bars?`<div class="bigcmp">${s.bars.map((b,i)=>barsCard(b,i)).join('')}</div>`:''}
  ${foot(s.conclusion&&{type:'good',html:s.conclusion,style:'background:#eef3ff;border-color:#c9d8ff;color:#0f1b3d'})}</div>`;

/* 核心结论：对比条 + 三张结论卡 */
R.summary=s=>head(s)+`<div class="body bigcmp">${s.bars.map((b,i)=>barsCard(b,i)).join('')}</div>
  <div class="trio">${(s.trio||[]).map((t,i)=>`<div class="tcard rv d${i}"><div class="n">${t.n}</div><h5>${t.h}</h5><p>${t.p}</p></div>`).join('')}</div>`;

/* 通用卡片网格：手法/问题/特征 + 视频缩略图 + 可选完播率进度条 */
R.cards=s=>{
  const cols=s.cols||3, big=cols>=5;
  return head(s)+`<div class="body cols c${cols}">${s.cards.map((c,i)=>{
    const side=sideCls(c.side||s.side||'B');
    return `<div class="hcard ${side} rv d${i+1}">${c.badge?`<span class="badge-top">${c.badge}</span>`:''}
      ${c.tag?`<span class="tag${side}">${c.tag}</span>`:''}<h5>${c.title}</h5>
      ${big?refs(c.refs,{size:'lg'}):''}
      ${c.quote?`<div class="quote"${big?' style="font-size:13px"':''}>${c.quote}</div>`:''}
      ${big?'':refs(c.refs,{size:c.refSize!==undefined?c.refSize:(s.refSize||'')})}
      ${c.rate?`<div><div class="rate"><div class="big">${c.rate.v}<small>%</small></div><div class="lab">${c.rate.label||'3s<br>完播率'}</div></div><div class="meter"><i style="--w:${c.rate.v}%"></i>${s.marker?`<u style="left:${s.marker.pct}%"></u>`:''}</div>${s.marker?`<div class="meter-note"><span>0</span><span>${s.marker.label}</span></div>`:''}</div>`:''}
    </div>`}).join('')}</div>`+foot(s.footer);
};

/* 横向对比（左A右B逐行） */
R.versus=s=>head(s)+`<div class="body">${versus(s.heads||[LBL.A,LBL.B],s.rows)}</div>`+(s.note?`<p class="sub rv" style="margin-top:22px">${s.note}</p>`:'');

/* 区间对比图（如年龄段 vs 目标人群）+ 逐行对比 */
R.range_vs=s=>{
  const g=s.range, span=g.max-g.min, pc=v=>(v-g.min)/span*100;
  return head(s)+`<div class="body split"><div class="card rv"><h4>${g.title}</h4><div class="age"><div class="axis">
    <div class="core" style="left:${pc(g.core.from)}%;width:${pc(g.core.to)-pc(g.core.from)}%"><span>${g.core.label}</span></div>
    ${g.bars.map((b,i)=>`<div class="bar" style="background:var(--${b.side==='A'?'A':'B'});left:${pc(b.from)}%;width:${pc(b.to)-pc(b.from)}%;top:${22+i*56}px">${b.label}</div>`).join('')}
    <div class="ticks">${g.ticks.map(t=>`<span style="left:${pc(t)}%">${t}</span>`).join('')}</div></div></div>
    ${g.note?`<p style="font-size:13px;color:var(--ink2);margin-top:8px">${g.note}</p>`:''}</div>
    ${versus(s.heads||[LBL.A,LBL.B],s.rows)}</div>`;
};

/* 时间轴 + “B参考→A改造”路径 */
R.timeline_paths=s=>{
  const t=s.timeline;
  return head(s)+`<div class="body"><div class="card rv" style="margin-bottom:22px"><h4>${t.title}</h4><div class="tl">
   ${t.rows.map(r=>`<div class="tl-row"><div class="who ${r.side==='A'?'txtA':'txtB'}">${r.who}<br><span style="font-weight:500;color:var(--ink3)">${r.sub||''}</span></div><div class="track"><span class="pin" style="left:${r.sec/t.max*100}%;--c:var(--${r.side==='A'?'A':'B'})">${r.label}</span></div></div>`).join('')}
   <div class="tl-axis">${t.ticks.map(k=>`<span style="left:${k/t.max*100}%">${k}s</span>`).join('')}</div></div></div>
   <div class="paths">${s.paths.map((p,i)=>`<div class="path rv d${i}"><div><div class="lbl txtB">${p.refLabel||'B 参考'}</div>${ref(p.from)}</div><div class="arrow">➜</div><div><div class="lbl txtA">${p.toLabel||'A 改造'}</div>${ref(p.to)}</div><div class="txt"><span class="tagB">路径 ${i+1}</span><h5>${p.title}</h5><p>${p.desc}</p></div></div>`).join('')}</div></div>`;
};

/* 模板卡：流程箭头 + KPI + 适用对象 */
R.templates=s=>head(s)+`<div class="body cols c${Math.min(s.tpls.length,4)}">${s.tpls.map((t,i)=>`<div class="tpl rv d${i}"><div class="top">${ref(t.ref)}<div><span class="tagB">${t.tag}</span><h5 style="margin-top:6px">${t.title}</h5><div class="sub2">${t.desc}</div></div></div>
  <div class="flow">${t.flow.map(f=>`<span>${f}</span>`).join('')}</div>
  <div class="kpis">${t.kpis.map(k=>`<div class="kpi"><b>${k.v}</b><span>${k.t}</span></div>`).join('')}</div>
  <div class="apply">${t.apply||''}${refs(t.applyRefs,{size:'sm'})}</div></div>`).join('')}</div>`;

/* 优化清单：现状 / 做法 / 行动 */
R.checklist=s=>{
  const h=s.heads||['','A 批现状','B 批做法','行动建议'];
  return head(s)+`<div class="body chk"><div class="hd">${h.map(x=>`<div>${x}</div>`).join('')}</div>${s.rows.map((r,i)=>`<div class="row rv d${i}"><div class="k"><span>${r.icon||''}</span>${r.k}</div><div class="ca">${r.a}</div><div class="cb">${r.b}</div><div class="cc">➜ ${r.c}</div></div>`).join('')}</div>`;
};

/* 总结：公式卡 + 范例卡 */
R.formulas=s=>head(s)+`<div class="body formula">${s.items.map((f,i)=>`<div class="fm rv d${i}"><div class="ico">${f.ico}</div><h5>${f.t}</h5><p>${f.d}</p>${f.from?`<div class="vsline"><s>${f.from}</s> → <b>${f.to}</b></div>`:''}</div>`).join('')}</div>
  ${s.paradigm?`<div class="paradigm">${s.paradigm.map((p,i)=>`<div class="pd rv d${i}">${ref({n:p.n,cap:''})}<div><h5>${p.t}</h5><p>${p.d}</p><div class="kp">${p.kp}</div></div></div>`).join('')}</div>`:''}`;

/* 素材库 */
R.gallery=s=>{
  const nA=ITEMS.filter(i=>i.batch==='A').length, nB=ITEMS.filter(i=>i.batch==='B').length;
  const multi=nA&&nB;
  return head(s)+`<div class="body">${multi?`<div class="filters" id="filters"><button class="fbtn on" data-f="all">全部 ${ITEMS.length}</button><button class="fbtn" data-f="A">${LBL.A} ${nA}</button><button class="fbtn" data-f="B">${LBL.B} ${nB}</button></div>`:''}
   <div class="gal" id="gal">${ITEMS.map(i=>ref(i.n)).join('')}</div></div>${s.foot?`<div class="foot">${s.foot}</div>`:''}`;
};

/* 兜底：自定义 HTML */
R.html=s=>s.html;

/* ================= 渲染 ================= */
const S=CONTENT.slides;
$('#app').innerHTML=S.map((s,i)=>{
  if(!R[s.type]) return `<section class="slide" id="${s.id||'s'+i}"><h2 class="title">未知组件类型：${s.type}</h2></section>`;
  return `<section class="slide ${s.type==='cover'?'cover':''}" id="${s.id||'s'+i}" data-i="${i}">${R[s.type](s)}</section>`;
}).join('');
$('#dots').innerHTML=S.map((s,i)=>`<a href="#${s.id||'s'+i}" data-t="${s.label||s.id}"></a>`).join('');

/* reveal + nav */
const secs=[...document.querySelectorAll('section.slide')], dots=[...document.querySelectorAll('#dots a')];
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');e.target.querySelectorAll('.rv,.metric,.age,.hcard,.tpl').forEach(x=>x.classList.add('in'))}}),{threshold:.12}):null;
document.querySelectorAll('.rv,.slide').forEach(el=>io?io.observe(el):el.classList.add('in'));
let cur=0;
function setCur(){const y=scrollY+innerHeight*.4;let k=0;secs.forEach((s,i)=>{if(s.offsetTop<=y)k=i});cur=k;dots.forEach((d,i)=>d.classList.toggle('on',i===k));$('#counter').textContent=(k+1)+' / '+secs.length;$('#prog').style.width=(scrollY/(document.documentElement.scrollHeight-innerHeight)*100)+'%'}
addEventListener('scroll',setCur,{passive:true});setCur();
function go(k){k=Math.max(0,Math.min(secs.length-1,k));secs[k].scrollIntoView({behavior:'smooth'})}
addEventListener('keydown',e=>{
  if($('#modal').classList.contains('open')){if(e.key==='Escape')closeM();return}
  if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
});

/* filters */
if($('#filters'))$('#filters').addEventListener('click',e=>{const b=e.target.closest('.fbtn');if(!b)return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('#gal .ref').forEach(r=>r.classList.toggle('hide',b.dataset.f!=='all'&&!r.classList.contains(b.dataset.f)))});

/* modal */
const mv=$('#mv');
function parseScript(t){return String(t||'').split('\n').map(l=>{const m=l.match(/^\s*(\d+(?:\.\d+)?)\s*[-~～至到]\s*(\d+(?:\.\d+)?)\s*s?\s*[：:]\s*(.*)$/);return m?{s:+m[1],e:+m[2],t:m[3]}:null}).filter(Boolean)}
function openM(n){
  const it=byN[n];if(!it)return;
  const units=parseScript(it.script);
  mv.pause();$('#merr').style.display='none';
  mv.src=it.url;$('#merrlink').href=it.url;
  mv.play().catch(()=>{});
  $('#minfo').innerHTML=`<div class="hd"><span class="${it.batch==='A'?'tagA':'tagB'}">${it.batch} 批</span><h3>#${n}${it.client?' · '+it.client:''}</h3><a class="mopen" href="${it.url}" target="_blank" rel="noopener">新窗口打开 ↗</a></div>
  ${ANN[n]?`<div class="note"><b>报告引用点：</b>${ANN[n]}</div>`:''}
  <div class="scr"><h4>分段脚本 · 点击时间跳转</h4>${units.length?units.map(u=>`<div class="su" data-s="${u.s}" data-e="${u.e}"><span class="t">${u.s}–${u.e}s</span><span>${u.t.replace(/</g,'&lt;')}</span></div>`).join(''):`<div class="su"><span>${String(it.script||'暂无脚本').replace(/</g,'&lt;').replace(/\n/g,'<br>')}</span></div>`}</div>`;
  $('#modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeM(){mv.pause();mv.removeAttribute('src');mv.load();$('#modal').classList.remove('open');document.body.style.overflow=''}
mv.addEventListener('error',()=>{$('#merr').style.display='block'});
mv.addEventListener('timeupdate',()=>{const t=mv.currentTime;document.querySelectorAll('.su[data-s]').forEach(el=>el.classList.toggle('act',t>=+el.dataset.s&&t<+el.dataset.e))});
$('#minfo').addEventListener('click',e=>{const s=e.target.closest('.su[data-s]');if(s){mv.currentTime=+s.dataset.s;mv.play().catch(()=>{})}});
$('#mclose').onclick=closeM;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('click',e=>{const r=e.target.closest('.ref[data-n]');if(r)openM(+r.dataset.n)});
</script>
</body>
</html>
